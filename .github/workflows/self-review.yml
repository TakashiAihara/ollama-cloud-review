name: self-review

# This repository reviews its own PRs with the action at the PR's head, so a change to
# action.yml runs here before a release reaches other callers.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    # Fork PRs get no secrets, and opencode refuses bot actors.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ollama-cloud-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          # Kept out of the code so trying a model is a settings change. Unset, the job fails.
          model: ${{ vars.REVIEW_MODEL }}
          api-key: ${{ secrets.OLLAMA_API_KEY }}
